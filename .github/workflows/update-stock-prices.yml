name: Update stock prices

# 起動は外部スケジューラ (cron-job.org) からの workflow_dispatch で行う。
# GitHub 純正の schedule cron は発火が不安定なため使用しない。
# cron-job.org が平日 JST 9:00-16:00 / 15分間隔で叩く。
on:
  workflow_dispatch:        # cron-job.org / GitHub UI から起動

# 同時実行を抑止 (前のrunがYahooを叩いている最中に次のrunが重なるのを防ぐ)
concurrency:
  group: update-stock-prices
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install minimal deps
        run: |
          python -m pip install --upgrade pip
          pip install python-dotenv

      - name: Run update_stock_prices.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python update_stock_prices.py
